# nLemon-14 — the run config. Single source of truth (spec §4.1).
# Nothing in this repo hardcodes a hyperparameter; every script reads this file
# and every artifact records the hash of the config it was produced with.

project_name: nLemon-14
seed: 1337

# Bit-reproducible training, not just reproducible initialisation (ADR-016).
# The seed alone fixes the starting weights; the backward pass still accumulates
# with atomics whose order varies, so identical runs drifted apart by the third
# decimal. Costs ~7% throughput. Turn off only to measure that cost.
strict_determinism: true

# --- model shape (never changed to fit VRAM — see ADR-004) -------------------
vocab_size: 8000
d_model: 384
n_layers: 6
n_heads: 6
context_len: 256
dropout: 0.1
mlp_ratio: 4      # hidden width of each block's MLP, as a multiple of d_model
bias: true        # bias terms in Linear layers (LayerNorm always has one)

# --- training ---------------------------------------------------------------
# VRAM fitting happens here and only here: lower micro_batch, raise grad_accum
# to keep the effective batch (micro_batch * grad_accum_steps) constant.
micro_batch: 16
grad_accum_steps: 4
lr: 3.0e-4
max_steps: 20000
warmup_steps: 1000

# optimizer + schedule
weight_decay: 0.1     # applied to matmul weights only, never to biases/LayerNorm
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
min_lr_ratio: 0.1     # cosine floor, as a fraction of lr

# training loop bookkeeping
eval_interval: 500    # optimizer steps between validation passes
eval_iters: 100       # batches averaged per validation pass
log_interval: 20
ckpt_interval: 2000

# --- Phase 4 gate ------------------------------------------------------------
# Agreed before the run, not fitted to it. Measured floors on held-out val:
# uniform 8000, unigram 389.91, bigram 41.81 (results/perplexity_floors.md).
# 8.0 is 5.2x better than the bigram floor - a bar that can actually fail.
val_ppl_threshold: 8.0

# The second half of the gate is "coherent little stories, not word salad".
# The bands are not invented: the same statistics are measured on real corpus
# documents and generated text has to land inside the corpus's own percentile
# range. Precursor to the Phase 5 feature-checker (ADR-005).
coherence_ref_docs: 2000        # real val docs used to build the reference bands
coherence_vocab_docs: 100000    # train docs used to build the known-word set
coherence_band_low_pct: 5
coherence_band_high_pct: 95
coherence_samples: 16           # generated continuations scored
coherence_bootstrap: 400        # resampled corpus groups behind the pooled bands
coherence_new_tokens: 200
coherence_temperature: 0.8
coherence_top_k: 40

# --- decoding ----------------------------------------------------------------
# Sampling knobs change what the model *says* without changing what it knows.
# Before SFT, that matters: comparing base to sft under different decoding would
# measure the decoder, not the fine-tune. These are swept once against the corpus
# bands (results/decoding_sweep.md) so the pinned pair below is a measured choice,
# and every cross-stage comparison from Phase 5 on uses it unchanged.
# The pinned pair below must appear in this grid; the sweep asserts it, because
# a sweep that never measures the value it is justifying justifies nothing.
decode_sweep_temperatures: [0.2, 0.5, 0.7, 0.8, 0.9, 1.1, 1.4]
decode_sweep_top_k: [0, 20, 40]     # 0 = no truncation
decode_sweep_samples: 6
decode_sweep_new_tokens: 160

# --- SFT: instruction pairs (Phase 5) ----------------------------------------
# The held-out split is over SUBJECTS, not phrasings (ADR-023): all templates
# appear in both sets, so the eval asks whether the model follows an instruction
# about a thing it was never instructed about.
sft_subject_scan_docs: 200000   # docs scanned to mine the subject pool
sft_pair_scan_docs: 400000      # docs scanned when building pairs
sft_subject_pool: 400           # top-N determiner-followed words considered
sft_min_subject_count: 200      # a candidate subject must be this common
# ...and must be the HEAD of its noun phrase, not a modifier. The determiner
# test alone promotes adjectives ("a brave bird" makes 'brave' look like a
# subject), and "Write a story about a brave." is not an instruction.
sft_min_head_ratio: 0.5
sft_heldout_subject_frac: 0.2
sft_max_pairs: 40000
sft_eval_prompts: 200
sft_min_response_words: 60      # keep pairs whose response is a real story
sft_max_response_words: 220

# Feature-checker floors (ADR-005). is_story and not_degenerate are FLOORS, not
# part of the adherence delta: base emits stories unconditionally, so is_story is
# near-saturated before SFT touches anything and has no headroom to show learning.
checker_min_sentences: 3
checker_min_story_words: 40
checker_max_repeat_rate: 0.0333   # the Phase 4 corpus p95 for repeated 4-grams
checker_max_repeat_run: 2         # the Phase 4 corpus p95

# Decoding for the SFT gate. Read from here, not from a shared default, so a
# later phase changing the global decode default cannot silently re-run this
# gate at settings it was never pre-registered against.
sft_gate_temperature: 0.8
sft_gate_top_k: 40
# 245, not 200 (ADR-028). Two independent reasons, both measured:
#   (a) generate() feeds out[-context_len:], so the instruction stays inside the
#       attention window only while prompt + generated <= 256. The longest
#       held-out prompt is 11 tokens, so 245 is the largest cap that keeps the
#       subject visible for the whole response. Above it the model is being
#       asked to keep writing about a thing it can no longer see, and
#       subject_mention would decay for a reason that is not the fine-tune.
#   (b) at 200 tokens the band's upper edge of 200 words was unreachable
#       (200 tokens buys ~155 words), so length_band was silently one-sided and
#       is_story had become a truncation detector: base fails it 66% of the time
#       in its longest quartile versus 57% in its shortest, because long
#       responses get cut off mid-sentence at the cap. SFT's job is to make
#       responses longer, so the gate as first pinned would have punished the
#       model for succeeding. See results/sft_budget_census.md.
sft_gate_new_tokens: 245

# --- PRE-REGISTERED Phase 5 gate thresholds ----------------------------------
# Agreed and committed BEFORE src/sft.py existed and before any fine-tune ran.
# Check the git history: this block lands in its own commit, ahead of the one
# that adds the training code. Phase 4's bar was agreed minutes after the run
# launched (ADR-017); this is the corrected version of that process.
#
# THE PRE-REGISTERED QUANTITY IS THE DELTA, not the absolute bar. The bar is
# base + delta, computed mechanically, so re-measuring the floor with a corrected
# instrument cannot loosen the commitment (ADR-028). Detection floor at n=200 is
# ~9.3 points, so both deltas are ~2.7x noise.
sft_gate_subject_mention_delta: 0.250
sft_gate_length_band_delta: 0.255

# Absolute bars = base + delta. Anchored to the measured base floor on the same
# 200 held-out prompts, at the same pinned decoding, scored by the same checker.
#     subject_mention 35.0%  (shuffled control 6.5%, ceiling 100.0%)
#     length_band     44.5%  (ceiling 92.5%)
#     is_story        69.0%  (floor only - near-saturated, no headroom)
#     not_degenerate  74.5%  (floor only)
# ^ measured at sft_gate_new_tokens = 200. That cap was wrong (ADR-028), so these
# four numbers are re-measured at 245 and the bars re-anchored in the next commit.
# The floors move WITH the re-measured base: keeping is_story at 0.69 while
# raising the cap would be the one change that genuinely made the gate easier.
sft_gate_subject_mention_min: 0.60    # base 35.0% -> +25.0 pts, z = 5.2
sft_gate_length_band_min: 0.70        # base 44.5% -> +25.5 pts, z = 5.1
sft_gate_is_story_min: 0.69           # base floor: must not regress
sft_gate_not_degenerate_min: 0.745    # base floor: must not regress
# If the shuffled control climbs, the model is naming everything rather than the
# thing it was asked about, and subject_mention stops meaning adherence.
sft_gate_shuffled_max: 0.10

# --- data -------------------------------------------------------------------
dataset_name: roneneldan/TinyStories
dataset_revision: main      # resolved to an exact commit sha in data/manifest.json
doc_separator: "<|endoftext|>"
max_train_docs: 0           # 0 = use the entire split
max_val_docs: 0
peek_samples: 3             # stories dumped to results/samples/corpus_peek.md

# --- tokenizer --------------------------------------------------------------
# Byte-level BPE, so there is no OOV and no unk token to configure.
# tokenizer_train_docs bounds the *training* sample only; the whole corpus is
# still encoded. 8k merges converge long before 1.84 GiB of text, and this
# machine has ~1.8 GiB of free RAM — a VRAM/RAM fit made via a recorded config
# knob rather than a silent change (ADR-004). The number is measured, not
# guessed: see results/tokenizer_subset_sweep.md.
tokenizer_train_docs: 200000
tokenizer_min_frequency: 2

# --- architecture gate (Phase 3) ---------------------------------------------
# (a) the parameter budget the design is claimed to hit, and how far the real
#     model may sit from it before that claim is wrong;
# (b) the single-batch overfit that proves the wiring: a correctly wired model
#     can memorise one batch, so if the loss does not collapse, something is
#     disconnected. These are gate thresholds, so they live here rather than in
#     an assert someone can quietly edit.
param_budget: 14000000
param_budget_tol: 0.10
# 600 steps at 1e-3 is measured, not guessed: results/overfit_margin.md.
# At 300 steps the worst of three seeds lands at 0.42 and the gate becomes a
# coin flip; at 600 the worst is 0.011, ~9x under the target. Raising the lr to
# 3e-3 is worse, not faster - it oscillates instead of converging.
overfit_steps: 600
overfit_target_loss: 0.1
overfit_lr: 1.0e-3
overfit_margin_seeds: [1337, 7, 99]

# --- paths ------------------------------------------------------------------
data_dir: data
ckpt_dir: checkpoints
results_dir: results
